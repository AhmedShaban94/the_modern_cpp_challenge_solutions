# This is a basic workflow to help you get started with Actions
name: CMake Build Matrix
on:
  push:
  pull_request:
  release:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest MSVC",
            os: windows-latest,
            build_type: "Release",
            generator: "Ninja"
          }
        - {
            name: "Ubuntu_Latest_GCC",
            os: ubuntu-latest,
            build_type: "Release",
            generator: "Ninja"
          }
        - {
            name: "macOS Latest Clang",
            os: macos-latest,
            build_type: "Release",
            generator: "Ninja"
          }

    steps:
      - uses: actions/checkout@v4

      - name: Print env
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: startsWith(matrix.config.os, 'windows')
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies on windows
        if: startsWith(matrix.config.os, 'windows')
        run: |
          choco install ninja cmake
          ninja --version
          cmake --version

      - name: Install dependencies on ubuntu
        if: startsWith(matrix.config.name, 'Ubuntu_Latest_GCC')
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build cmake curl libcurl4-openssl-dev
          ninja --version
          cmake --version
          gcc --version

      - name: Install dependencies on macos
        if: startsWith(matrix.config.os, 'macos')
        run: |
          brew install cmake ninja
          ninja --version
          cmake --version

      - name: Configure
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_CLANG_TIDY=OFF \
            -G "${{ matrix.config.generator }}"

      - name: Build
        shell: bash
        run: |
          cmake --build build --config ${{ matrix.config.build_type }} -j 14 --

      - name: Test
        shell: bash
        run: |
          ctest --test-dir build -j14 -C ${{ matrix.config.build_type }} -T test --output-on-failure

  lint:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy-19 clang-tools-19 libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_CLANG_TIDY=OFF

      - name: Run clang-tidy
        shell: bash
        run: |
          SRC_DIR="$PWD"
          find "$SRC_DIR" \
            -path "$SRC_DIR/build" -prune -o \
            -path "$SRC_DIR/external" -prune -o \
            \( -name 'main.cpp' -o -name 'tests_main.cpp' \) -print \
            | xargs -r -P "$(nproc)" -n 8 clang-tidy-19 -p build --
